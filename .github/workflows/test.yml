name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run plugin tests (no Fusion 360 needed)
        env:
          PYTHONIOENCODING: utf-8
        run: python run_tests.py
      - name: Validate bundled example exports
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/validate_examples.py examples/
